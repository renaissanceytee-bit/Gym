<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>ASCEND — Your journey, your pace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="#" data-view="overview"><span class="brand-mark">A</span><span>ASCEND</span></a><div class="nav-label">YOUR SPACE</div>
<nav class="main-nav" aria-label="Main navigation"><button class="nav-item active" data-view="overview"><span class="nav-icon">◫</span>Overview</button><button class="nav-item" data-view="training"><span class="nav-icon">↗</span>Training</button><button class="nav-item" data-view="nutrition"><span class="nav-icon">◉</span>Nutrition</button><button class="nav-item" data-view="habits"><span class="nav-icon">◇</span>Habits & missions</button><button class="nav-item" data-view="achievements"><span class="nav-icon">✳</span>Achievements<span class="nav-count">300</span></button><button class="nav-item" data-view="journey"><span class="nav-icon">⌁</span>90-day journey</button><button class="nav-item" data-view="insights"><span class="nav-icon">✦</span>Progress & reflection</button><button class="nav-item" data-view="community"><span class="nav-icon">◎</span>Challenges</button></nav>
<div class="side-bottom"><div class="side-promo"><div class="promo-orb">✦</div><strong>Small steps.<br>Stronger you.</strong><p>Your pace is the right pace. Keep building.</p><div class="promo-line"><span id="journey-progress-side"></span></div><small id="journey-day-side">DAY 1 OF YOUR 90-DAY JOURNEY</small></div><button class="profile-button" data-view="settings"><span class="avatar" id="avatar-letter">J</span><span class="profile-copy"><strong id="profile-name">Jordan Lee</strong><small id="profile-level">Level 01 · Beginner</small></span><span class="dots">···</span></button></div></aside>
<main class="main-content"><header class="topbar"><div class="breadcrumbs"><span>ASCEND</span><b>/</b><strong id="page-label">Overview</strong></div><div class="top-actions"><span class="live-date" id="today-label"></span><button class="icon-button" id="notification-button" aria-label="Notifications">♧</button><span class="avatar small" id="avatar-letter-top">J</span></div></header><div class="page-wrap"><div id="view-root"></div><footer><span>ASCEND <b>·</b> YOUR JOURNEY, YOUR PACE</span><span>Prototype data is stored on this device <i>✦</i></span></footer></div></main></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="workout-dialog"><form method="dialog" id="workout-form"><div class="dialog-top"><div><div class="eyebrow">TRAINING LOG</div><h2>Log a workout</h2></div><button class="close-button" value="cancel" aria-label="Close">×</button></div><label class="field-label">Workout name<input id="workout-name" required maxlength="80" placeholder="e.g. Full body strength"></label><div class="field-row"><label class="field-label">Duration (min)<input id="workout-duration" type="number" min="1" max="600" value="45" required></label><label class="field-label">Workout type<select id="workout-type"><option>Strength</option><option>Cardio</option><option>Mobility</option><option>Sports</option><option>Other</option></select></label></div><label class="field-label">Focus / exercises<input id="workout-focus" maxlength="100" placeholder="e.g. Squat, bench press"></label><label class="field-label">Notes <span class="optional">OPTIONAL</span><textarea id="workout-notes" rows="2" maxlength="250" placeholder="How did it feel?"></textarea></label><button class="primary-button full-button" value="default">Save workout <span>→</span></button></form></dialog>
<dialog id="meal-dialog"><form method="dialog" id="meal-form"><div class="dialog-top"><div><div class="eyebrow">NUTRITION LOG</div><h2>Log a meal</h2></div><button class="close-button" value="cancel" aria-label="Close">×</button></div><label class="field-label">Meal name<input id="meal-name" required maxlength="80" placeholder="e.g. Greek yogurt and berries"></label><div class="field-row"><label class="field-label">Meal type<select id="meal-type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select></label><label class="field-label">Protein (g)<input id="meal-protein" type="number" min="0" max="500" value="20"></label></div><label class="field-label">Notes <span class="optional">OPTIONAL</span><textarea id="meal-notes" rows="2" maxlength="250" placeholder="Optional meal notes"></textarea></label><button class="primary-button full-button" value="default">Save meal <span>→</span></button></form></dialog><script src="app.js"></script></body></html>
